
<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ಕನ್ನಡ ರಾಜ್ಯೋತ್ಸವ 2026</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;600;700;800&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: 'Noto Sans Kannada', sans-serif;
    background: linear-gradient(135deg,#12051d,#240b35,#09051a);
    color: white;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 20% 20%,rgba(255,0,0,.15),transparent 30%),
      radial-gradient(circle at 80% 70%,rgba(255,220,0,.12),transparent 30%);
    z-index: -1;
}

/* BACKGROUND HEART ANIMATION */

.heart {
    position: fixed;
    bottom: -50px;
    font-size: 22px;
    animation: floatHeart linear infinite;
    pointer-events: none;
    z-index: 0;
    opacity: .7;
}

@keyframes floatHeart {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }
    20% { opacity: .8; }
    100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

/* COLLEGE HEADER */

.college-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    padding: 25px;
    background: linear-gradient(135deg,#fff8dc,#ffffff,#fff4c5);
    border-bottom: 5px solid #e8a800;
    text-align: center;
    position: relative;
    z-index: 2;
}

.college-logo {
    width: 125px;
    height: 125px;
    object-fit: contain;
}

.college-title {
    flex: 1;
}

.college-title h1 {
    font-size: 34px;
    font-weight: 900;
    color: #003399;
    margin: 0;
}

.college-title h2 {
    color: #b40000;
    font-size: 24px;
    margin: 8px 0;
}

.college-title p {
    color: #222;
    font-weight: bold;
    margin: 5px;
}

/* MAIN */

.container {
    width: 95%;
    max-width: 1100px;
    margin: 35px auto;
    position: relative;
    z-index: 1;
}

.section {
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,215,0,.3);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 25px;
    margin-bottom: 30px;
    box-shadow: 0 0 25px rgba(255,0,0,.08);
}

.heading {
    text-align: center;
    color: #ffd700;
    font-size: 28px;
    margin-bottom: 25px;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 5px #ff0000; }
    to { text-shadow: 0 0 20px #ffd700; }
}

/* FORM */

label {
    display: block;
    margin: 18px 0 8px;
    font-weight: 700;
    color: #ffe680;
}

input, select {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 2px solid #ffd700;
    background: #fff;
    color: #111;
    font-family: inherit;
    font-size: 16px;
}

input:focus, select:focus {
    outline: 3px solid rgba(255,215,0,.3);
}

option {
    color: #111;
    background: #fff;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 25px;
    border: none;
    border-radius: 12px;
    font-family: inherit;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    background: linear-gradient(90deg,#ffcc00,#ff6600);
    color: #240000;
    transition: .3s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 20px rgba(255,215,0,.5);
}

.photo-preview {
    display: block;
    width: 120px;
    height: 120px;
    object-fit: cover;
    border-radius: 50%;
    border: 4px solid #ffd700;
    margin: 20px auto;
    display: none;
}

/* GENERATED POSTER */

#generatedSection {
    display: none;
    text-align: center;
}

#posterCanvas {
    width: 100%;
    max-width: 650px;
    height: auto;
    border-radius: 15px;
    border: 3px solid #ffd700;
    box-shadow: 0 0 30px rgba(255,215,0,.3);
    background: white;
}

/* VOICE MESSAGE */

.voice-section {
    text-align: center;
}

audio {
    width: 100%;
    max-width: 600px;
    margin-top: 20px;
}

/* ORIGINAL POSTER */

.original-poster-section {
    text-align: center;
    margin-top: 40px;
}

.original-poster {
    display: block;
    width: 100%;
    max-width: 750px;
    height: auto;
    margin: 25px auto;
    border-radius: 15px;
    border: 3px solid #ffd700;
    box-shadow: 0 0 25px rgba(255,215,0,.3);
}

/* FOOTER */

footer {
    text-align: center;
    padding: 25px;
    color: #ffd700;
}

/* MOBILE */

@media(max-width:650px) {
    .college-header {
        padding: 12px;
        gap: 6px;
    }

    .college-logo {
        width: 60px;
        height: 60px;
    }

    .college-title h1 {
        font-size: 15px;
    }

    .college-title h2 {
        font-size: 12px;
    }

    .college-title p {
        font-size: 10px;
    }

    .heading {
        font-size: 21px;
    }

    .section {
        padding: 15px;
    }
}
</style>
</head>
